<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Binary Encryptor & Decryptor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://vexornull.github.io/favicon/favicon.png">
</head>
<body>

    <div class="container">
        <h1>Binary Text Converter</h1>
        <p class="subtitle">Encrypt plain text to 010101 and decrypt it back easily!</p>

        <div class="input-group">
            <label for="inputText">Enter Text or Binary Code:</label>
            <textarea id="inputText" placeholder="Type something here... (e.g., Hello or 01001000...)"></textarea>
        </div>

        <div class="btn-group">
            <button id="encryptBtn" onclick="encryptText()">Encrypt to Binary</button>
            <button id="decryptBtn" onclick="decryptText()">Decrypt to Text</button>
            <button id="clearBtn" onclick="clearFields()">Clear</button>
        </div>

        <div class="input-group">
            <label for="outputText">Result:</label>
            <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
        </div>

        <!-- Credit Section -->
        <div class="footer">
            <p>Created with ❤️ by <a href="https://instagram.com/vexornull" target="_blank">Tanveer Hussain</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
